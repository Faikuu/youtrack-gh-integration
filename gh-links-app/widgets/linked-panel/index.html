<!doctype html><html><head><link rel="stylesheet" href="https://unpkg.com/@jetbrains/ring-ui-built@6/components/style.css">
<style>
:root{color-scheme:light dark}
body{margin:0;background:transparent}
.gh{--fg:#1f2328;--muted:#57606a;--border:#d0d7de;--input:#ffffff;--hover:#f6f8fa;--accent:#0969da;--danger:#cf222e;--bg:#ffffff;
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px;color:var(--fg);max-width:100%;overflow-x:hidden;padding:10px;box-sizing:border-box;background:var(--bg);border:1px solid var(--border);border-radius:8px}
@media (prefers-color-scheme:dark){
.gh{--fg:#e6edf3;--muted:#8b949e;--border:#30363d;--input:#0d1117;--hover:#161b22;--accent:#4493f8;--danger:#f85149;--bg:#1e1f24}
}
.gh h4{margin:2px 0 8px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:6px}
.gh h4 svg{flex:none}
.gh .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.gh .topbar h4{margin:0}
.gh #close{font-size:18px;line-height:1}
@keyframes gh-pulse{0%,100%{opacity:.45}50%{opacity:1}}
.gh .skel{pointer-events:none}
.gh .skel .badge{min-width:52px;color:transparent;animation:gh-pulse 1.2s ease-in-out infinite}
.gh .skel-line{display:block;height:12px;border-radius:6px;background:var(--hover);border:1px solid var(--border);margin:4px 0;animation:gh-pulse 1.2s ease-in-out infinite}
.gh .tabs{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 8px}
.gh .tabs button{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--hover);border-radius:6px;padding:3px 9px;font-size:12px;cursor:pointer;color:var(--muted);max-width:100%}
.gh .tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.gh .tabs button svg{flex:none}
.gh .search{position:relative}
.gh .search svg{position:absolute;left:8px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.gh .search input[type=text]{width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:6px;padding:6px 8px 6px 28px;font-size:13px;background:var(--input);color:var(--fg)}
.gh input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(9,105,218,.15)}
.gh .row{display:flex;align-items:center;gap:8px;padding:6px 4px;border-bottom:1px solid var(--border);min-width:0}
.gh .row:last-child{border-bottom:none}
.gh .badge{flex:none;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-radius:10px;padding:2px 8px;color:#fff}
.gh .badge.issue{background:#1a7f37}.gh .badge.pr{background:#8250df}.gh .badge.commit{background:#57606a}
.gh .meta{min-width:0;flex:1}
.gh .meta a{color:var(--accent);text-decoration:none;font-weight:600;word-break:break-all}
.gh .meta a:hover{text-decoration:underline}
.gh .meta .title{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.gh .x{flex:none;border:none;background:none;color:var(--muted);font-size:14px;cursor:pointer;border-radius:4px;padding:0 4px}
.gh .x:hover{color:var(--danger);background:var(--hover)}
.gh .linkbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:10px;border:1px solid var(--border);background:var(--hover);border-radius:6px;padding:6px;font-size:13px;cursor:pointer;color:var(--fg)}
.gh .muted{color:var(--muted);padding:6px 4px}
.gh .err{color:var(--danger);padding:4px;word-break:break-word}
.gh .res a{color:var(--fg);text-decoration:none;display:flex;gap:8px;align-items:baseline;padding:6px 4px;border-radius:6px;min-width:0}
.gh .res a:hover{background:var(--hover)}
</style></head>
<body><div class="gh">
<div class="topbar"><h4>GitHub links</h4><button id="close" class="x" title="Close" hidden>×</button></div>
<div id="list"><div class="muted">Loading…</div></div>
<div id="err" class="err"></div>
<h4><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6.5 9.5l3-3M7.8 5.2l.7-.7a3 3 0 014.2 4.2l-.7.7M8.2 10.8l-.7.7a3 3 0 01-4.2-4.2l.7-.7"/></svg>Link new</h4>
<div class="tabs" id="tabs">
<button data-t="issue" class="on"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="1.6" fill="currentColor" stroke="none"/></svg>Issues</button><button data-t="pr"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="4.5" cy="4.5" r="2.2"/><circle cx="4.5" cy="11.5" r="2.2"/><circle cx="11.5" cy="7" r="2.2"/><path d="M4.5 6.7v2.6M11.5 7H7.4c-1.6 0-2.9-.9-2.9-2.3"/></svg>Pull requests</button><button data-t="commit"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="2.4"/><path d="M1.5 8h4.1M10.4 8h4.1"/></svg>Commits</button>
</div>
<div class="search"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14.5 14.5"/></svg><input id="q" type="text" placeholder="Search GitHub to link…" autocomplete="off"></div>
<div id="suggest" class="res"></div>
<div id="suggest-err" class="err"></div>
<button id="link" class="linkbtn"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="6" cy="6" r="2.5"/><path d="M6 8.5v5M3.5 13.5h5M10 8L14.5 3.5M14.5 3.5H11M14.5 3.5V7"/></svg>Open full search…</button>
<script type="module">
const host = await YTApp.register();
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function errText(e){ return e && e.message ? e.message : String(e); }
function searchError(e){
  const m = errText(e);
  if (/\b504\b|timeout|timed out/i.test(m)) return 'GitHub search timed out. Try a longer, more specific query.';
  if (/\b502\b/.test(m)) return 'GitHub rejected the search (rate limit or scope). Wait a moment and retry.';
  if (/\b40[01]\b/.test(m)) return 'Search not allowed (token missing or no permission). Check the app settings.';
  return m;
}
let type = 'issue';
async function load(){
  try {
    const data = await host.fetchApp('backend/links', {scope:true});
    document.getElementById('err').textContent = '';
    render(data.links || []);
  } catch (e) {
    document.getElementById('list').innerHTML = '<div class="muted">Could not load links.</div>';
    document.getElementById('err').textContent = 'Error: ' + errText(e);
  }
}
function label(l){
  if (l.kind === 'commit' && l.sha) return esc(l.repo) + '@' + esc(String(l.sha).slice(0,7));
  return esc(l.repo) + (l.number ? '#' + esc(String(l.number)) : '');
}
function render(links){
  const list = document.getElementById('list');
  if (!links.length) { list.innerHTML = '<div class="muted">No GitHub links yet.</div>'; return; }
  list.innerHTML = links.map(l=>`<div class="row"><span class="badge ${esc(l.kind)}">${esc(l.kind)}</span><span class="meta"><a href="${esc(l.url)}" target="_blank" rel="noopener">${label(l)}</a><span class="title">${esc(l.title||'')}</span></span><button class="x" data-url="${esc(l.url)}" title="Unlink">×</button></div>`).join('');
  list.querySelectorAll('button[data-url]').forEach(b => { b.onclick = async () => {
    try {
      await host.fetchApp('backend/links', {scope:true, method:'DELETE', query:{url: b.dataset.url}});
      document.getElementById('err').textContent = '';
      await load();
    } catch (e) {
      document.getElementById('err').textContent = 'Error: ' + errText(e);
    }
  }; });
}
document.getElementById('link').onclick = () => { host.enterModalMode(); inModal = true; syncMode(); };
document.getElementById('close').onclick = () => { try { if (host.exitModalMode) host.exitModalMode(); } finally { inModal = false; syncMode(); } };
let inModal = false;
function syncMode(){
  document.getElementById('link').hidden = inModal;
  document.getElementById('close').hidden = !inModal;
}
syncMode();
function skeleton(n, kind){
  let rows = '';
  for (let i = 0; i < n; i++) rows += `<div class="row skel"><span class="badge ${esc(kind)}">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span><span class="meta"><span class="skel-line" style="width:45%"></span><span class="skel-line" style="width:85%"></span></span></div>`;
  return rows;
}
document.querySelectorAll('#tabs button').forEach(b => { b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); type = b.dataset.t; doSuggest();
}; });
let t = null, seq = 0;
document.getElementById('q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(doSuggest, 500); });
async function doSuggest(){
  const raw = document.getElementById('q').value.trim();
  const q = raw.replace(/^(gh|fix)\s+/i, '');
  const box = document.getElementById('suggest');
  const sErr = document.getElementById('suggest-err');
  if (q.length < 2) { box.innerHTML = ''; sErr.textContent = ''; return; }
  const my = ++seq;
  box.innerHTML = skeleton(3, type);
  try {
    const data = await host.fetchApp('backend-global/search', {query:{q, type}});
    if (my !== seq) return;
    sErr.textContent = '';
    const items = (data.items || []).slice(0, 5);
    if (!items.length) { box.innerHTML = '<div class="muted">No results.</div>'; return; }
    box.innerHTML = items.map((it, i)=>{
      const ref = it.kind === 'commit' && it.sha ? esc(it.repo) + '@' + esc(String(it.sha).slice(0,7)) : esc(it.repo) + (it.number ? '#' + esc(String(it.number)) : '');
      return `<a href="#" data-i="${i}"><span class="badge ${esc(it.kind)}">${esc(it.kind)}</span><span class="meta"><b>${ref}</b><span class="title">${esc(it.title || it.url)}</span></span></a>`;
    }).join('');
    box.querySelectorAll('a[data-i]').forEach(a => { a.onclick = async ev => {
      ev.preventDefault();
      try {
        const it = items[Number(a.dataset.i)];
        const updated = await host.fetchApp('backend/links', {scope:true, method:'POST', body: it});
        render(updated.links || []); box.innerHTML = ''; document.getElementById('q').value = '';
      } catch (err2) {
        sErr.textContent = 'Error: ' + errText(err2);
      }
    }; });
  } catch (e) {
    if (my !== seq) return;
    box.innerHTML = '';
    sErr.textContent = 'Error: ' + searchError(e);
  }
}
await load();
</script></div></body></html>
