<!doctype html><html><head><link rel="stylesheet" href="https://unpkg.com/@jetbrains/ring-ui-built@6/components/style.css"></head>
<body style="padding:12px;font-family:system-ui;max-width:640px">
<h3 style="margin-top:0">GitHub Settings</h3>
<p><b>allowedRepos</b> (app settings): comma-separated <code>owner/repo</code> entries, e.g. <code>acme/web, acme/api</code>. Blank = all repos allowed. Tokens stay server-side; widgets never handle secrets.</p>
<p>Webhook URL (configure in the GitHub repo settings):</p>
<code id="hook" style="word-break:break-all"></code>
<p id="status">Loading status…</p>
<script type="module">
const host = await YTApp.register();
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
document.getElementById('hook').textContent =
  window.location.origin + '/api/extensionEndpoints/gh-links-app/backend-global/gh-webhook?token=…';
try {
  const data = await host.fetchApp('backend-global/search', {scope:true, query:{q:'st'}});
  const n = Array.isArray(data.items) ? data.items.length : 0;
  document.getElementById('status').innerHTML = 'Backend reachable (search probe returned <b>' + esc(String(n)) + '</b> items).';
} catch (e) {
  document.getElementById('status').textContent = 'Status unavailable: ' + (e && e.message ? e.message : e);
}
</script></body></html>
