<!doctype html><html><head><link rel="stylesheet" href="https://unpkg.com/@jetbrains/ring-ui-built@6/components/style.css">
<style>
:root{color-scheme:light dark}
body{margin:0}
.gh{--fg:#1f2328;--muted:#57606a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px;color:var(--fg);padding:12px;max-width:640px;overflow-x:hidden;box-sizing:border-box}
@media (prefers-color-scheme:dark){
.gh{--fg:#e6edf3;--muted:#8b949e}
}
.gh h3{margin-top:0;color:var(--fg)}
.gh p{color:var(--fg)}
.gh code{word-break:break-all}
.gh .muted{color:var(--muted)}
</style></head>
<body><div class="gh">
<h3>GitHub Settings</h3>
<p><b>allowedRepos</b> (app settings): comma-separated scope entries — <code>owner/repo</code> for repos, a bare name for a whole org. Blank = all of GitHub. Tokens stay server-side; widgets never handle secrets.</p>
<p>Webhook URL (configure in the GitHub repo settings):</p>
<code id="hook" style="word-break:break-all"></code>
<p id="status">Loading status…</p>
<script type="module">
const host = await YTApp.register();
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function instanceOrigin() {
  try {
    const o = window.location.origin;
    if (o && o !== 'null' && o.indexOf('http') === 0) return o;
  } catch (e) {}
  try {
    const r = document.referrer;
    if (r) {
      const o = new URL(r).origin;
      if (o && o.indexOf('http') === 0) return o;
    }
  } catch (e) {}
  return '';
}
const base = instanceOrigin();
const hookPath = '/api/extensionEndpoints/gh-links-app/backend-global/gh-webhook?token=…';
document.getElementById('hook').textContent = base ? base + hookPath : hookPath + '  (prepend https://<your-youtrack> before ?token=…)';
try {
  const data = await host.fetchApp('backend-global/search', {query:{q:'st'}});
  const n = Array.isArray(data.items) ? data.items.length : 0;
  document.getElementById('status').innerHTML = 'Backend reachable (search probe returned <b>' + esc(String(n)) + '</b> items).';
} catch (e) {
  document.getElementById('status').textContent = 'Status unavailable: ' + (e && e.message ? e.message : e);
}
</script></div></body></html>
