<!doctype html><html><head><link rel="stylesheet" href="https://unpkg.com/@jetbrains/ring-ui-built@6/components/style.css">
<style>
:root{color-scheme:light dark}
body{margin:0}
.gh{--fg:#1f2328;--muted:#57606a;--border:#d0d7de;--input:#ffffff;--hover:#f6f8fa;--accent:#0969da;--bg:#ffffff;
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px;color:var(--fg);padding:12px;max-width:100%;overflow-x:hidden;box-sizing:border-box;background:var(--bg);border-radius:8px}
@media (prefers-color-scheme:dark){
.gh{--fg:#e6edf3;--muted:#8b949e;--border:#30363d;--input:#0d1117;--hover:#161b22;--accent:#4493f8;--bg:#1e1f24}
}
.gh .tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px}
.gh .tabs button{border:1px solid var(--border);background:var(--hover);border-radius:6px;padding:4px 12px;font-size:13px;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.gh .tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.gh input[type=text]{width:100%;box-sizing:border-box;border:1px solid var(--border);border-radius:6px;padding:7px 9px;font-size:13px;background:var(--input);color:var(--fg);margin-top:8px}
.gh input[type=text]:first-of-type{margin-top:0}
.gh input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(9,105,218,.15)}
.gh .badge{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;border-radius:10px;padding:2px 8px;color:#fff;margin-right:8px}
.gh .badge.issue{background:#1a7f37}.gh .badge.pr{background:#8250df}.gh .badge.commit{background:#57606a}
.gh .res{margin-top:8px}
.gh .res a{color:var(--fg);text-decoration:none;display:block;padding:7px 6px;border-radius:6px}
.gh .res a:hover{background:var(--hover)}
.gh .res .title{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gh .muted{color:var(--muted)}
.gh .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.gh .topbar h4{margin:0;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.gh .x{border:none;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;border-radius:4px;padding:0 4px}
.gh .x:hover{color:var(--fg)}
@keyframes gh-pulse{0%,100%{opacity:.45}50%{opacity:1}}
.gh .skel{pointer-events:none}
.gh .skel .badge{min-width:52px;color:transparent;animation:gh-pulse 1.2s ease-in-out infinite}
.gh .skel-line{display:block;height:12px;border-radius:6px;background:var(--hover);border:1px solid var(--border);margin:4px 0;animation:gh-pulse 1.2s ease-in-out infinite}
</style></head>
<body><div class="gh">
<div class="topbar"><h4>Search GitHub</h4><button id="close" class="x" title="Close">×</button></div>
<div class="tabs" id="tabs">
<button data-t="issue" class="on"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="1.6" fill="currentColor" stroke="none"/></svg>Issues</button><button data-t="pr"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="4.5" cy="4.5" r="2.2"/><circle cx="4.5" cy="11.5" r="2.2"/><circle cx="11.5" cy="7" r="2.2"/><path d="M4.5 6.7v2.6M11.5 7H7.4c-1.6 0-2.9-.9-2.9-2.3"/></svg>Pull requests</button><button data-t="commit"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="8" cy="8" r="2.4"/><path d="M1.5 8h4.1M10.4 8h4.1"/></svg>Commits</button>
</div>
<input id="q" type="text" placeholder="Number (#123), hash, URL or text…" autocomplete="off">
<input id="r" type="text" placeholder="owner/repo filter (optional)" autocomplete="off">
<div id="res" class="res muted">Type to search GitHub.</div>
<script type="module">
const host = await YTApp.register();
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function errText(e){ return e && e.message ? e.message : String(e); }
function searchError(e){
  const m = errText(e);
  if (/\b504\b|timeout|timed out/i.test(m)) return 'GitHub search timed out. Try a longer, more specific query.';
  if (/\b502\b/.test(m)) return 'GitHub rejected the search (rate limit or scope). Wait a moment and retry.';
  if (/\b40[01]\b/.test(m)) return 'Search not allowed (token missing or no permission). Check the app settings.';
  return m;
}
let type = 'issue', timer = null, items = [], seq = 0;
document.getElementById('close').onclick = () => { try { if (host.exitModalMode) host.exitModalMode(); } catch (e) {} };
function skeleton(n, kind){
  let rows = '';
  for (let i = 0; i < n; i++) rows += `<div class="row skel" style="display:flex;gap:8px;align-items:baseline;padding:7px 6px"><span class="badge ${esc(kind)}">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span><span style="flex:1;min-width:0"><span class="skel-line" style="width:45%"></span><span class="skel-line" style="width:85%"></span></span></div>`;
  return rows;
}
document.querySelectorAll('#tabs button').forEach(b => { b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); type = b.dataset.t; doSearch();
}; });
async function doSearch(){
  const q = document.getElementById('q').value.trim();
  const repo = document.getElementById('r').value.trim();
  const box = document.getElementById('res');
  if (q.length < 2) { box.textContent = 'Type to search GitHub.'; items = []; return; }
  const my = ++seq;
  box.innerHTML = skeleton(4, type);
  try {
    const data = await host.fetchApp('backend-global/search', {query:{q, type, repo}});
    if (my !== seq) return;
    items = data.items || [];
  } catch (e) {
    if (my !== seq) return;
    box.textContent = 'Search failed: ' + searchError(e); items = []; return;
  }
  if (!items.length) { box.textContent = 'No results.'; return; }
  box.innerHTML = items.map((it, i)=>{
    const ref = it.kind === 'commit' && it.sha ? esc(it.repo) + '@' + esc(String(it.sha).slice(0,7)) : esc(it.repo) + (it.number ? '#' + esc(String(it.number)) : '');
    return `<a href="#" data-i="${i}"><span class="badge ${esc(it.kind)}">${esc(it.kind)}</span><b>${ref}</b><span class="title">${esc(it.title||it.url)}</span></a>`;
  }).join('');
  box.querySelectorAll('a[data-i]').forEach(a => { a.onclick = async e => {
    e.preventDefault();
    try {
      await host.fetchApp('backend/links', {scope:true, method:'POST', body: items[Number(a.dataset.i)]});
      await host.alert('Linked');
      if (host.exitModalMode) host.exitModalMode();
    } catch (err) {
      box.textContent = 'Link failed: ' + errText(err);
    }
  }; });
}
document.getElementById('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(doSearch, 500); });
document.getElementById('r').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(doSearch, 500); });
</script></div></body></html>
